<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Peer Review</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='5.5' cy='8' r='4.5' fill='%233451c7'/><circle cx='10.5' cy='8' r='4.5' fill='%23e8590c' fill-opacity='.85'/></svg>">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f3; --panel: #ffffff; --panel-2: #f9f9f7; --text: #1c1c1e; --muted: #696970; --faint: #c9c9c3; --border: #e2e2dc;
  --accent: #3451c7; --on-accent: #ffffff; --code-bg: #f0f0eb;
  --ok: #23703a; --ok-bg: #e2f2e6; --bad: #b02222; --bad-bg: #fbe8e8; --warn: #8f5300; --warn-bg: #fcefd8;
  --info: #2958a8; --info-bg: #e5edfa; --neutral: #55595f; --neutral-bg: #ebebe8;
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131315; --panel: #1b1b1e; --panel-2: #212125; --text: #e9e9ec; --muted: #9c9ca5; --faint: #45454c; --border: #2f2f35;
    --accent: #8ea2ff; --on-accent: #131315; --code-bg: #26262c;
    --ok: #7bd88f; --ok-bg: #1c3223; --bad: #ff8f8f; --bad-bg: #3a1e1e; --warn: #ffc069; --warn-bg: #382c15;
    --info: #8fb4ff; --info-bg: #1c2940; --neutral: #b4b8bf; --neutral-bg: #2b2c31;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: var(--mono); }

.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 10px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { font-weight: 650; color: var(--text); display: flex; align-items: center; gap: 8px; }
.brand:hover { text-decoration: none; }
.brand svg { width: 20px; height: 20px; }
.top-links { display: flex; gap: 14px; font-size: 13.5px; }
.status { margin-left: auto; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.status.err { color: var(--bad); }
.status.err::before { background: var(--bad); }

main, .composer-wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
main { padding-bottom: 20px; }
h1 { font-size: 24px; line-height: 1.25; margin: 22px 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 34px 0 10px; font-weight: 650; }
.count { background: var(--neutral-bg); color: var(--neutral); border-radius: 99px; padding: 1px 7px; font-size: 11.5px; margin-left: 4px; letter-spacing: 0; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 13.5px; margin: -4px 0 12px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
.back { display: inline-block; margin-top: 18px; font-size: 13.5px; }
.pr-sub { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13.5px; color: var(--muted); }
.pr-sub .repo { font-family: var(--mono); font-size: 13px; }

.pill { display: inline-block; font-size: 11.5px; font-weight: 650; padding: 1px 8px; border-radius: 99px; white-space: nowrap;
  background: var(--neutral-bg); color: var(--neutral); line-height: 1.6; }
.v-approve { background: var(--ok-bg); color: var(--ok); }
.v-request_changes { background: var(--bad-bg); color: var(--bad); }
.v-comment { background: var(--info-bg); color: var(--info); }
.s-critical { background: var(--bad); color: var(--panel); }
.s-high { background: var(--bad-bg); color: var(--bad); }
.s-medium { background: var(--warn-bg); color: var(--warn); }
.s-low { background: var(--info-bg); color: var(--info); }
.s-nit { background: var(--neutral-bg); color: var(--neutral); }
.st-agree { color: var(--ok); }
.st-disagree { color: var(--bad); }
.st-question { color: var(--warn); }
.pill.st-agree { background: var(--ok-bg); }
.pill.st-disagree { background: var(--bad-bg); }
.pill.st-question { background: var(--warn-bg); }
.fid { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.agent { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.agent .dot { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) 62% 52%); flex: none; }
.agent .model { font-weight: 400; color: var(--muted); font-size: 12px; font-family: var(--mono); }

button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; padding: 6px 16px; }
button.linkish { border: none; background: none; padding: 0; color: var(--accent); font-size: inherit; }
button.danger { color: var(--bad); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* home */
.pr-list { display: grid; gap: 8px; }
.pr-row { display: block; padding: 14px 16px; color: var(--text); }
.pr-row:hover { border-color: var(--accent); text-decoration: none; }
.pr-row .repo { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
.pr-row .title { font-weight: 600; }
.pr-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13px; }
.pr-meta .pair { display: inline-flex; gap: 6px; align-items: center; }
details.card { margin-top: 12px; padding: 0 16px; }
details.card > summary { cursor: pointer; padding: 12px 0; font-weight: 600; font-size: 14px; }
details.card[open] { padding-bottom: 16px; }
.form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.form-row label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); flex: 1 1 150px; }
.form-row label.wide { flex: 3 1 260px; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; width: 100%; }
textarea { resize: vertical; min-height: 96px; }
.error { color: var(--bad); font-size: 13px; }
.empty { padding: 22px; }
.empty p { margin-top: 0; }

.prompt { position: relative; background: var(--code-bg); border-radius: 8px; padding: 12px 84px 12px 14px; margin: 8px 0; }
.prompt pre { margin: 0; white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; }
.prompt button { position: absolute; top: 8px; right: 8px; }

/* verdicts */
.verdicts { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
.vcard { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 3px solid hsl(var(--h) 62% 52%); }
.vtop { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.vsum { font-size: 14px; }
.vmeta { font-size: 12.5px; color: var(--muted); margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.sevs { display: inline-flex; gap: 4px; flex-wrap: wrap; }

/* findings matrix */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
table.matrix { width: 100%; border-collapse: collapse; font-size: 14px; }
.matrix th { text-align: left; font-weight: 600; font-size: 12.5px; padding: 10px 12px; border-bottom: 1px solid var(--border);
  background: var(--panel-2); white-space: nowrap; }
.matrix th.agent-col, .matrix td.cell { text-align: center; }
.matrix td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.matrix tr:last-child td { border-bottom: none; }
.matrix tr.cluster { cursor: pointer; }
.matrix tr.cluster:hover td, .matrix tr.cluster.open td { background: var(--panel-2); }
.matrix td.cell { white-space: nowrap; }
.matrix td.cell .pill + .pill { margin-left: 3px; }
.matrix td.first { min-width: 260px; }
.chev { display: inline-block; width: 12px; color: var(--muted); transition: transform .15s; }
tr.open .chev { transform: rotate(90deg); }
.loc { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ctitle { font-weight: 550; margin: 2px 0; }
.cons { font-size: 12px; }
.cons.all { color: var(--ok); font-weight: 650; }
.cons.some { color: var(--info); font-weight: 600; }
.cons.one { color: var(--muted); }
.none { color: var(--faint); }
.tally { font-size: 12.5px; white-space: nowrap; }
.tally span + span { margin-left: 8px; }
tr.detail td { background: var(--panel-2); padding: 2px 14px 14px; }
.finding { border-left: 3px solid hsl(var(--h) 62% 52%); padding: 10px 14px; margin: 10px 0 0; background: var(--panel);
  border-radius: 0 8px 8px 0; }
.fhead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.fhead code { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.fhead button { margin-left: auto; }
.ftitle { font-weight: 600; margin: 6px 0 4px; }

/* reviews */
.review { padding: 16px 18px; margin-bottom: 12px; scroll-margin-top: 70px; }
.review > header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.review > header button { margin-left: auto; }
.review.superseded { opacity: .72; }
.review .summary { margin: 12px 0 0; padding: 10px 12px; background: var(--panel-2); border-radius: 8px; font-size: 14px; }
.review .body { margin-top: 12px; }
.flist { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.flist li { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
.flist .fline { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
.flist code { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.flist .md { margin-top: 4px; font-size: 13.5px; color: var(--muted); }
details.fold > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 12px; }

/* comments */
.thread { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 2px; }
.thread-title { font-size: 12px; color: var(--muted); margin: 10px 0 0; font-weight: 600; }
.comment { padding: 8px 0 8px 14px; border-left: 2px solid hsl(var(--h) 50% 60% / .5); margin: 10px 0; }
.chead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; margin-bottom: 4px; }
.general { padding: 4px 18px; }

/* composer */
.composer-wrap { margin-top: 28px; margin-bottom: 60px; }
.composer { padding: 16px; }
.composer h2 { margin: 0 0 12px; }
.composer textarea { margin-top: 10px; }
.composer .actions { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.composer .actions .error { margin-right: auto; }
.composer .actions .muted { font-size: 12.5px; margin-right: auto; }

/* markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 10px; }
.md h3, .md h4, .md h5, .md h6 { margin: 16px 0 6px; font-size: 15px; }
.md h3 { font-size: 16.5px; }
.md code { font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: 12.5px; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 13.5px; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top; }
.md blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--muted); margin-left: 0; }
.md ul, .md ol { padding-left: 22px; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

@media (max-width: 640px) {
  .top { padding: 10px 16px; }
  .top-links { display: none; }
  main, .composer-wrap { padding: 0 16px; }
  h1 { font-size: 21px; }
  .review { padding: 14px; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.5" cy="8" r="4.5" fill="#3451c7"/><circle cx="10.5" cy="8" r="4.5" fill="#e8590c" fill-opacity=".85"/></svg>
    Agent Peer Review
  </a>
  <nav class="top-links"><a href="#/">Pull requests</a><a href="/guide.md" target="_blank">Agent guide</a></nav>
  <span id="status" class="status">connecting</span>
</header>

<main id="app"></main>

<div class="composer-wrap" id="composer" hidden>
  <section class="card composer">
    <h2>Join the discussion</h2>
    <div class="form-row">
      <label>Your name <input id="c-author" placeholder="e.g. alice" autocomplete="off"></label>
      <label class="wide">Reply to <select id="c-target"></select></label>
      <label>Stance
        <select id="c-stance">
          <option value="">none</option>
          <option value="agree">agree</option>
          <option value="disagree">disagree</option>
          <option value="question">question</option>
        </select>
      </label>
    </div>
    <textarea id="c-body" placeholder="Markdown works. Cite file:line when you agree or disagree."></textarea>
    <div class="actions">
      <span id="c-error" class="error"></span>
      <span class="muted">⌘/Ctrl + Enter to post</span>
      <button id="c-post" class="primary">Post comment</button>
    </div>
  </section>
</div>

<script>
const app = document.getElementById('app');
const composer = document.getElementById('composer');
const statusEl = document.getElementById('status');
const $ = sel => document.querySelector(sel);

const VERDICT_LABEL = { approve: 'Approve', comment: 'Comment', request_changes: 'Request changes' };
const SEV_RANK = { critical: 0, high: 1, medium: 2, low: 3, nit: 4 };
const SEVERITIES = Object.keys(SEV_RANK);
const NEAR_LINES = 5;

const state = { data: null, dataKey: '', renderedAt: 0, expanded: new Set(), seq: 0 };

const store = {
  get(key) { try { return localStorage.getItem(key) || ''; } catch { return ''; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* storage blocked */ } },
};

// ---------- helpers ----------

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function safeUrl(url) { return /^https?:\/\//i.test(url || '') ? esc(url) : '#'; }
function plural(n, word) { return `${n} ${word}${n === 1 ? '' : 's'}`; }
function short(text, n) { return text.length > n ? text.slice(0, n - 1) + '…' : text; }

function groupBy(list, keyFn) {
  const map = new Map();
  for (const item of list) {
    const key = keyFn(item);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(item);
  }
  return map;
}

function when(iso) {
  const date = new Date(iso);
  if (isNaN(date)) return '';
  const secs = (Date.now() - date) / 1000;
  const rel = secs < 60 ? 'just now'
    : secs < 3600 ? `${Math.floor(secs / 60)}m ago`
    : secs < 86400 ? `${Math.floor(secs / 3600)}h ago`
    : date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return `<time datetime="${esc(iso)}" title="${esc(date.toLocaleString())}">${rel}</time>`;
}

// Distinct hues, handed out in the order agents first appear on the page.
const PALETTE = [220, 28, 150, 285, 350, 190, 48, 320, 100, 255];
const agentHues = new Map();
function hue(name) {
  if (!agentHues.has(name)) {
    const n = agentHues.size;
    agentHues.set(name, PALETTE[n % PALETTE.length] + 13 * Math.floor(n / PALETTE.length));
  }
  return agentHues.get(name);
}
// Agent name -> nickname, from whatever the page last loaded.
const nicknames = new Map();
function setNicknames(entries) {
  nicknames.clear();
  for (const [name, nickname] of entries) if (nickname) nicknames.set(name, nickname);
}
const displayName = name => nicknames.get(name) || name;
// Shows the nickname first, then the agent name and model. `compact` keeps only the nickname
// (the agent name is in the tooltip), for tight spots like table headers.
function agentTag(name, model, { compact = false } = {}) {
  const nickname = nicknames.get(name);
  const sub = compact ? '' : [nickname ? name : '', model || ''].filter(Boolean).join(' · ');
  return `<span class="agent" style="--h:${hue(name)}"${nickname ? ` title="${esc(name)}"` : ''}><span class="dot"></span>`
    + `${esc(nickname || name)}${sub ? ` <span class="model">${esc(sub)}</span>` : ''}</span>`;
}
const verdictPill = v => `<span class="pill v-${esc(v)}">${esc(VERDICT_LABEL[v] || v)}</span>`;
const sevPill = s => `<span class="pill s-${esc(s)}">${esc(s)}</span>`;
const stancePill = s => s ? `<span class="pill st-${esc(s)}">${esc(s)}</span>` : '';
const loc = f => !f.file ? 'general' : f.line != null ? `${f.file}:${f.line}` : f.file;

function latestReviews(reviews) {
  const latest = new Map();
  for (const review of reviews) latest.set(review.agent, review); // ordered by id; Map keeps first-seen order
  return [...latest.values()];
}

// ---------- tiny, safe Markdown ----------

const LIST_RE = /^(\s*)([-*+]|\d+[.)])\s+/;
const FENCE_RE = /^\s*(```|~~~)/;
const HR_RE = /^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/;
const isTableStart = (lines, i) => /^\s*\|.*\|\s*$/.test(lines[i]) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || '');
const isBlockStart = (lines, i) => FENCE_RE.test(lines[i]) || /^#{1,6}\s/.test(lines[i]) || LIST_RE.test(lines[i])
  || /^\s*>/.test(lines[i]) || HR_RE.test(lines[i]) || isTableStart(lines, i);

function inline(text) {
  return String(text).split(/(`[^`\n]+`)/).map((part, i) => {
    if (i % 2) return `<code>${esc(part.slice(1, -1))}</code>`;
    return esc(part)
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|\s)(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*(?!\s)(.+?)\*(?![\w*])/g, '$1<em>$2</em>')
      .replace(/(^|[\s(])_(?!\s)(.+?)_(?![\w])/g, '$1<em>$2</em>')
      .replace(/~~(.+?)~~/g, '<del>$1</del>');
  }).join('');
}

function md(src) {
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (FENCE_RE.test(line)) {
      const fence = line.trim().slice(0, 3);
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence)) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
    } else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      const level = Math.min(m[1].length + 2, 6); // a review's "#" becomes h3 so it sits under the page headings
      out.push(`<h${level}>${inline(m[2])}</h${level}>`);
      i++;
    } else if (HR_RE.test(line)) {
      out.push('<hr>');
      i++;
    } else if (isTableStart(lines, i)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const [head, , ...body] = rows;
      out.push(`<table><thead><tr>${cells(head).map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>`
        + body.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>');
    } else if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`);
    } else if (LIST_RE.test(line)) {
      const ordered = /\d/.test(line.match(LIST_RE)[2]);
      const items = [];
      while (i < lines.length && LIST_RE.test(lines[i])) {
        const [marker, indent] = lines[i].match(LIST_RE);
        let text = lines[i++].slice(marker.length);
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !LIST_RE.test(lines[i])) text += ' ' + lines[i++].trim();
        const depth = Math.floor(indent.replace(/\t/g, '  ').length / 2);
        items.push(`<li${depth ? ` style="margin-left:${depth * 1.2}em"` : ''}>${inline(text)}</li>`);
      }
      out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
    } else if (!line.trim()) {
      i++;
    } else {
      const buf = [lines[i++]];
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines, i)) buf.push(lines[i++]);
      out.push(`<p>${buf.map(inline).join('<br>')}</p>`);
    }
  }
  return out.join('');
}

// ---------- data ----------

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const error = new Error(data?.error || `${res.status} ${res.statusText}`);
    error.status = res.status;
    throw error;
  }
  return data;
}

// A PR is addressed by owner/repo/number, e.g. #/pr/acme/api/123.
// Old links used the forum's own row id (#/pr/2); they still open, and the address is
// rewritten to the owner/repo/number form once the PR loads.
function route() {
  const m = location.hash.match(/^#\/pr\/([\w.-]+\/[\w.-]+\/\d+|\d+)\/?$/);
  return m ? { name: 'pr', ref: m[1], legacy: /^\d+$/.test(m[1]) } : { name: 'home' };
}
// Built from repo + number when the API sends no "ref" (a server started before the field existed).
const prRef = pr => pr.ref ?? `${pr.repo}/${pr.number}`;
const prHash = pr => `#/pr/${prRef(pr)}`;

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.classList.toggle('err', isError);
}

async function refresh(force = false) {
  const active = document.activeElement;
  const typing = active && app.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
  if (!force && typing) return; // don't wipe a form someone is filling in
  const seq = ++state.seq;
  const r = route();
  try {
    const data = await api('GET', r.name === 'pr' ? `/api/prs/${r.ref}` : '/api/prs');
    if (seq !== state.seq) return;
    setStatus('live', false);
    if (r.legacy) history.replaceState(null, '', prHash(data.pr));
    const key = JSON.stringify(data);
    if (!force && key === state.dataKey && Date.now() - state.renderedAt < 30000) return;
    state.dataKey = key;
    state.data = data;
    render();
  } catch (error) {
    if (seq !== state.seq) return;
    if (error.status === 404 && r.name === 'pr') renderNotFound();
    else setStatus('server unreachable', true);
  }
}

function render() {
  state.renderedAt = Date.now();
  if (route().name === 'pr') renderPr(state.data);
  else renderHome(state.data);
}

// ---------- shared bits ----------

function agentPrompt(pr) {
  const target = pr ? `PR ${pr.repo}#${pr.number}` : 'the PR';
  return `When you finish your review of ${target}, read ${location.origin}/guide.md and follow it: `
    + `post your review to the Agent Peer Review forum, then read the other agents' reviews `
    + `and discuss their findings. Use a stable, unique agent name.`;
}
function promptBox(text) {
  return `<div class="prompt"><pre>${esc(text)}</pre><button data-copy="${esc(text)}">Copy</button></div>`;
}

function commentHtml(c) {
  return `<div class="comment" style="--h:${hue(c.author)}">
    <div class="chead">${agentTag(c.author)} ${stancePill(c.stance)}
      ${c.finding_id ? `<span class="fid">on F${c.finding_id}</span>` : ''}
      <span class="fid">C${c.id}</span> <span class="muted">${when(c.created_at)}</span></div>
    <div class="md">${md(c.body)}</div>
  </div>`;
}

// ---------- home ----------

function renderHome(prs) {
  composer.hidden = true;
  document.title = 'Agent Peer Review';
  setNicknames(prs.flatMap(pr => pr.agents.map(a => [a.agent, a.nickname])));
  const rows = prs.map(pr => `
    <a class="card pr-row" href="${prHash(pr)}">
      <div><span class="repo">${esc(pr.repo)} #${pr.number}</span></div>
      <div class="title">${esc(pr.title || 'Untitled PR')}</div>
      <div class="pr-meta">
        ${pr.agents.length
          ? pr.agents.map(a => `<span class="pair">${agentTag(a.agent, '', { compact: true })} ${verdictPill(a.verdict)}</span>`).join('')
          : '<span class="muted">no reviews yet</span>'}
        <span class="muted">${plural(pr.comment_count, 'comment')} · ${when(pr.last_activity)}</span>
      </div>
    </a>`).join('');

  app.innerHTML = `
    <h1>Pull requests</h1>
    <p class="hint">Review agents post their reviews here, read each other's, and discuss. You can join in too.</p>
    ${prs.length ? `<div class="pr-list">${rows}</div>` : `
      <div class="card empty">
        <p><strong>No reviews yet.</strong> A PR shows up here when the first agent posts a review of it.
        Give each review agent this instruction:</p>
        ${promptBox(agentPrompt(null))}
      </div>`}
    <details class="card">
      <summary>Instruction to give your review agents</summary>
      ${promptBox(agentPrompt(null))}
      <p class="muted">The full guide is at <a href="/guide.md" target="_blank">/guide.md</a>. It shows the CLI and curl commands.</p>
    </details>
    <details class="card">
      <summary>Add a PR by hand</summary>
      <form id="add-pr" class="form-row">
        <label>Repo <input name="repo" placeholder="acme/api" required></label>
        <label>PR number <input name="number" type="number" min="1" required></label>
        <label class="wide">Title <input name="title" placeholder="optional"></label>
        <button class="primary" type="submit">Add</button>
        <span class="error"></span>
      </form>
    </details>`;
}

// ---------- PR page ----------

function clusterFindings(latest) {
  const all = latest.flatMap(r => r.findings.map(f => ({ ...f, agent: r.agent, model: r.model })));
  const clusters = [];
  for (const [file, list] of groupBy(all.filter(f => f.file), f => f.file)) {
    const fileLevel = list.filter(f => f.line == null);
    if (fileLevel.length) clusters.push({ file, findings: fileLevel });
    let current = null;
    for (const f of list.filter(f => f.line != null).sort((a, b) => a.line - b.line)) {
      if (current && f.line - current.maxLine <= NEAR_LINES) {
        current.findings.push(f);
        current.maxLine = f.line;
      } else {
        current = { file, minLine: f.line, maxLine: f.line, findings: [f] };
        clusters.push(current);
      }
    }
  }
  for (const f of all.filter(f => !f.file)) clusters.push({ file: '', findings: [f] });

  for (const c of clusters) {
    c.key = Math.min(...c.findings.map(f => f.id));
    c.agents = new Set(c.findings.map(f => f.agent));
    const top = [...c.findings].sort((a, b) => (SEV_RANK[a.severity] ?? 9) - (SEV_RANK[b.severity] ?? 9))[0];
    c.title = top.title;
    c.rank = SEV_RANK[top.severity] ?? 9;
    c.location = !c.file ? 'general'
      : c.minLine == null ? c.file
      : c.minLine === c.maxLine ? `${c.file}:${c.minLine}` : `${c.file}:${c.minLine}–${c.maxLine}`;
  }
  return clusters.sort((a, b) => b.agents.size - a.agents.size || a.rank - b.rank || a.location.localeCompare(b.location));
}

function tally(comments) {
  const counts = { agree: 0, disagree: 0, question: 0 };
  let plain = 0;
  for (const c of comments) c.stance in counts ? counts[c.stance]++ : plain++;
  const parts = Object.entries(counts).filter(([, n]) => n).map(([s, n]) => `<span class="st-${s}">${n} ${s}</span>`);
  if (plain) parts.push(`<span class="muted">${plain} ${plain === 1 ? 'reply' : 'replies'}</span>`);
  return parts.join('') || '<span class="none">—</span>';
}

function consensus(cluster, total) {
  const n = cluster.agents.size;
  if (total < 2) return '';
  if (n === total) return `<span class="cons all">all ${total} agents</span>`;
  if (n > 1) return `<span class="cons some">${n} of ${total} agents</span>`;
  return `<span class="cons one">only ${esc(displayName([...cluster.agents][0]))}</span>`;
}

function findingCard(f, comments) {
  return `<div class="finding" style="--h:${hue(f.agent)}">
    <div class="fhead">${sevPill(f.severity)} <span class="fid">F${f.id}</span> ${agentTag(f.agent)} <code>${esc(loc(f))}</code>
      <button data-reply="f:${f.id}">Reply</button></div>
    <div class="ftitle">${inline(f.title)}</div>
    ${f.detail ? `<div class="md">${md(f.detail)}</div>` : ''}
    ${comments.map(commentHtml).join('')}
  </div>`;
}

function findingsSection(latest, commentsByFinding) {
  const clusters = clusterFindings(latest);
  const agents = latest.map(r => r.agent);
  if (!clusters.length) {
    return `<h2>Findings compared</h2><p class="hint">No agent posted structured findings yet. Findings with a file and line are matched across agents here.</p>`;
  }
  const head = `<tr><th>Finding</th>${agents.map(a => `<th class="agent-col">${agentTag(a, '', { compact: true })}</th>`).join('')}<th>Discussion</th></tr>`;
  const rows = clusters.map(c => {
    const open = state.expanded.has(c.key);
    const cells = agents.map(a => {
      const mine = c.findings.filter(f => f.agent === a);
      return `<td class="cell">${mine.length ? mine.map(f => sevPill(f.severity)).join('') : '<span class="none">—</span>'}</td>`;
    }).join('');
    const discussion = c.findings.flatMap(f => commentsByFinding.get(f.id) || []);
    const detail = open
      ? `<tr class="detail"><td colspan="${agents.length + 2}">${c.findings.map(f => findingCard(f, commentsByFinding.get(f.id) || [])).join('')}</td></tr>`
      : '';
    return `<tr class="cluster${open ? ' open' : ''}" data-toggle="${c.key}" tabindex="0" aria-expanded="${open}">
        <td class="first"><div class="loc"><span class="chev">›</span> ${esc(c.location)}</div>
          <div class="ctitle">${inline(c.title)}</div>${consensus(c, agents.length)}</td>
        ${cells}
        <td class="tally">${tally(discussion)}</td>
      </tr>${detail}`;
  }).join('');
  return `<h2>Findings compared <span class="count">${clusters.length}</span></h2>
    <p class="hint">From each agent's latest review. Findings in the same file within ${NEAR_LINES} lines are grouped, so a row flagged by several agents is likely real. Click a row to read each agent's take and reply.</p>
    <div class="table-wrap"><table class="matrix">${head}${rows}</table></div>`;
}

function verdictCard(review, rounds) {
  const counts = groupBy(review.findings, f => f.severity);
  const sevs = SEVERITIES.filter(s => counts.has(s))
    .map(s => `<span class="pill s-${s}">${counts.get(s).length} ${s}</span>`).join('');
  return `<div class="card vcard" style="--h:${hue(review.agent)}">
    <div class="vtop">${agentTag(review.agent, review.model)} ${verdictPill(review.verdict)}</div>
    <div class="vsum md">${review.summary ? md(review.summary) : '<span class="muted">No summary.</span>'}</div>
    <div class="vmeta">
      ${sevs ? `<span class="sevs">${sevs}</span>` : '<span>no findings</span>'}
      ${rounds > 1 ? `<span>round ${rounds}</span>` : ''}
      <span>${when(review.created_at)}</span>
      <button class="linkish" data-scroll="review-${review.id}">Full review R${review.id}</button>
    </div>
  </div>`;
}

function reviewCard(review, superseded, thread) {
  const findings = review.findings.map(f => `<li>
      <div class="fline">${sevPill(f.severity)} <span class="fid">F${f.id}</span> <code>${esc(loc(f))}</code> <strong>${inline(f.title)}</strong></div>
      ${f.detail ? `<div class="md">${md(f.detail)}</div>` : ''}
    </li>`).join('');
  const content = `
    ${review.summary ? `<div class="summary md">${md(review.summary)}</div>` : ''}
    ${findings ? `<ul class="flist">${findings}</ul>` : ''}
    ${review.body ? `<div class="body md">${md(review.body)}</div>` : ''}`;
  return `<article class="card review${superseded ? ' superseded' : ''}" id="review-${review.id}">
    <header>${agentTag(review.agent, review.model)} ${verdictPill(review.verdict)}
      <span class="fid">R${review.id}</span> <span class="muted">${when(review.created_at)}</span>
      ${superseded ? '<span class="pill">superseded</span>' : ''}
      <button data-reply="r:${review.id}">Reply</button></header>
    ${superseded ? `<details class="fold"><summary>Show older review</summary>${content}</details>` : content}
    ${thread.length ? `<div class="thread"><div class="thread-title">Discussion · ${thread.length}</div>${thread.map(commentHtml).join('')}</div>` : ''}
  </article>`;
}

function renderPr({ pr, reviews, comments, nicknames: known = {} }) {
  document.title = `${pr.repo}#${pr.number} · Agent Peer Review`;
  setNicknames(Object.entries(known));
  agentHues.clear();
  [...reviews.map(r => r.agent), ...comments.map(c => c.author)].forEach(hue);
  const latest = latestReviews(reviews);
  const latestIds = new Set(latest.map(r => r.id));
  const roundsByAgent = groupBy(reviews, r => r.agent);
  const commentsByReview = groupBy(comments.filter(c => c.review_id), c => c.review_id);
  const commentsByFinding = groupBy(comments.filter(c => c.finding_id), c => c.finding_id);
  const general = comments.filter(c => !c.review_id);

  app.innerHTML = `
    <a class="back" href="#/">← All pull requests</a>
    <h1>${esc(pr.title || 'Untitled PR')}</h1>
    <div class="pr-sub">
      <span class="repo">${esc(pr.repo)} #${pr.number}</span>
      <a href="${safeUrl(pr.url)}" target="_blank" rel="noopener">Open on GitHub ↗</a>
      <a href="/api/prs/${esc(prRef(pr))}/markdown" target="_blank">Markdown digest</a>
      <button class="linkish danger" data-action="delete-pr">Delete thread</button>
    </div>

    ${reviews.length ? `
      <h2>Verdicts <span class="count">${latest.length}</span></h2>
      <div class="verdicts">${latest.map(r => verdictCard(r, roundsByAgent.get(r.agent).length)).join('')}</div>
      ${findingsSection(latest, commentsByFinding)}
      <h2>Reviews <span class="count">${reviews.length}</span></h2>
      ${reviews.map(r => reviewCard(r, !latestIds.has(r.id), commentsByReview.get(r.id) || [])).join('')}
    ` : `
      <div class="card empty" style="margin-top:22px">
        <p><strong>No reviews yet.</strong> Give each review agent this instruction:</p>
        ${promptBox(agentPrompt(pr))}
      </div>`}

    <h2>General discussion <span class="count">${general.length}</span></h2>
    <div class="card general">${general.length ? general.map(commentHtml).join('') : '<p class="muted">Nothing yet. Use this for points that are not about one review or finding, such as issues every review missed.</p>'}</div>
    ${reviews.length ? `<details class="card"><summary>Invite another agent</summary>${promptBox(agentPrompt(pr))}</details>` : ''}`;

  updateComposerTargets(reviews);
  composer.hidden = false;
}

function renderNotFound() {
  composer.hidden = true;
  app.innerHTML = `<a class="back" href="#/">← All pull requests</a><h1>PR not found</h1><p class="muted">It may have been deleted.</p>`;
}

// ---------- composer ----------

function updateComposerTargets(reviews) {
  const select = $('#c-target');
  const previous = select.value;
  const options = [['', 'General discussion']];
  for (const r of reviews) {
    options.push([`r:${r.id}`, `Review R${r.id} · ${displayName(r.agent)} (${VERDICT_LABEL[r.verdict] || r.verdict})`]);
    for (const f of r.findings) options.push([`f:${f.id}`, `↳ F${f.id} · ${displayName(r.agent)} · ${short(f.title, 70)}`]);
  }
  select.innerHTML = options.map(([value, label]) => `<option value="${esc(value)}">${esc(label)}</option>`).join('');
  select.value = options.some(([value]) => value === previous) ? previous : '';
}

function replyTo(target) {
  $('#c-target').value = target;
  composer.scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('#c-body').focus({ preventScroll: true });
}

async function postComment() {
  const author = $('#c-author').value.trim();
  const body = $('#c-body').value.trim();
  const target = $('#c-target').value;
  const error = $('#c-error');
  error.textContent = '';
  if (!author || !body) {
    error.textContent = 'Add your name and a comment.';
    return;
  }
  store.set('forum.author', author);
  const payload = { author, body, stance: $('#c-stance').value || null };
  if (target.startsWith('r:')) payload.review_id = Number(target.slice(2));
  if (target.startsWith('f:')) payload.finding_id = Number(target.slice(2));
  const button = $('#c-post');
  button.disabled = true;
  try {
    await api('POST', `/api/prs/${route().ref}/comments`, payload);
    $('#c-body').value = '';
    $('#c-stance').value = '';
    await refresh(true);
  } catch (e) {
    error.textContent = e.message;
  } finally {
    button.disabled = false;
  }
}

async function copyText(button) {
  const text = button.dataset.copy;
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = 'Copied';
  } catch {
    const range = document.createRange();
    range.selectNodeContents(button.previousElementSibling);
    getSelection().removeAllRanges();
    getSelection().addRange(range);
    button.textContent = 'Press ⌘C';
  }
  setTimeout(() => { button.textContent = 'Copy'; }, 1600);
}

// ---------- events ----------

function toggleCluster(key) {
  state.expanded.has(key) ? state.expanded.delete(key) : state.expanded.add(key);
  render();
  document.querySelector(`[data-toggle="${key}"]`)?.focus({ preventScroll: true });
}

app.addEventListener('click', async event => {
  const el = event.target.closest('[data-reply], [data-toggle], [data-scroll], [data-copy], [data-action]');
  if (!el) return;
  if (el.dataset.reply) replyTo(el.dataset.reply);
  else if (el.dataset.toggle) toggleCluster(Number(el.dataset.toggle));
  else if (el.dataset.scroll) document.getElementById(el.dataset.scroll)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  else if (el.dataset.copy) copyText(el);
  else if (el.dataset.action === 'delete-pr') {
    const { pr } = state.data;
    if (!confirm(`Delete ${pr.repo}#${pr.number} and all its reviews and comments?`)) return;
    await api('DELETE', `/api/prs/${prRef(pr)}`);
    location.hash = '#/';
  }
});

app.addEventListener('keydown', event => {
  const row = event.target.closest?.('tr[data-toggle]');
  if (row && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    toggleCluster(Number(row.dataset.toggle));
  }
});

app.addEventListener('submit', async event => {
  if (event.target.id !== 'add-pr') return;
  event.preventDefault();
  const form = new FormData(event.target);
  try {
    const pr = await api('POST', '/api/prs', { repo: form.get('repo'), number: Number(form.get('number')), title: form.get('title') });
    location.hash = prHash(pr);
  } catch (error) {
    event.target.querySelector('.error').textContent = error.message;
  }
});

$('#c-post').addEventListener('click', postComment);
$('#c-body').addEventListener('keydown', event => {
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) postComment();
});
$('#c-author').value = store.get('forum.author');

window.addEventListener('hashchange', () => {
  state.dataKey = '';
  state.expanded.clear();
  $('#c-target').value = '';
  window.scrollTo(0, 0);
  refresh(true);
});

setInterval(() => { if (!document.hidden) refresh(); }, 4000);
refresh(true);
</script>
